<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D2C 업무일지</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%93</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>

<style>
:root{
  --bg:#18181B;
  --bg-elev:#202024;
  --bg-elev-2:#29292E;
  --bg-focus:#323238;
  --border:#3A393F;
  --border-soft:#2C2C31;
  --text:#F2F0EA;
  --text-dim:#B4B1A8;
  --text-faint:#7C7A73;
  --accent:#F2F0EA;
  --accent-strong:#F2F0EA;
  --accent-strong-hover:#E2DFD4;
  --on-accent:#131316;
  --accent-soft:rgba(242,240,234,.08);
  --danger:#E2685A;
  --danger-soft:rgba(226,104,90,.14);
  --danger-border:#5C3730;
  --success:#F2F0EA;
  --warning:#B4B1A8;
  --sidebar-bg:#131315;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow:0 2px 6px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.3);
  --nav-home:#E7E4DA;
  --nav-routine:#7FD9BF;
  --nav-input:#C7A8F2;
  --nav-weekly:#7FB4E8;
  --nav-digest:#F0A0C4;
  --nav-reports:#F0C36B;
  --nav-shopdora:#F29E5A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);height:100vh;overflow:hidden;color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
input,textarea,select,button{font-family:inherit}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:84px;flex-shrink:0;background:var(--sidebar-bg);display:flex;flex-direction:column;align-items:center;padding:16px 8px;gap:6px;position:sticky;top:0;height:100vh;z-index:20;border-right:1px solid var(--border-soft);overflow-y:auto}
.sb-logo{font-size:23px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sb-btn{width:100%;border-radius:12px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 4px 9px;cursor:pointer;transition:all .15s;position:relative}
.sb-btn:hover{background:var(--bg-elev-2)}
.sb-tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;transition:all .15s}
.sb-label{font-size:12px;font-weight:600;color:var(--text-faint);letter-spacing:-.1px}
.sb-btn.active .sb-label{color:var(--text);font-weight:700}
.sb-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--sidebar-bg)}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg-elev);border-bottom:1px solid var(--border-soft);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.topbar-sub{font-size:12px;color:var(--text-faint);margin-top:1px;font-weight:400;font-family:var(--font-mono)}
.body-wrap{display:flex;flex:1;overflow:hidden;height:calc(100vh - 53px)}
.content-area{flex:1;overflow-y:auto;padding:22px 28px;min-width:0}
.content{max-width:900px;width:100%}
/* 카드 */
.card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.today{border-color:var(--text)}
.tag-wrap{position:relative;display:inline-block}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.2px;cursor:pointer;background:var(--bg-elev-2);color:var(--text-dim);border:1px solid var(--border-soft)}
.tag:hover{filter:brightness(1.15)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg-elev);border-radius:14px;padding:14px 16px;border:1px solid var(--border-soft);box-shadow:var(--shadow)}
.stat-card .val{font-family:var(--font-mono);font-size:25px;font-weight:700;color:var(--text)}
.btn-primary{padding:8px 16px;border-radius:9px;background:var(--accent-strong);color:var(--on-accent);border:none;font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer;transition:all .15s}
.btn-primary:hover{background:var(--accent-strong-hover)}
.btn-primary:disabled{background:var(--border);color:var(--text-faint);cursor:not-allowed}
.btn-outline{padding:5px 12px;border-radius:9px;background:var(--bg-elev);color:var(--text-dim);border:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .15s}
.btn-outline:hover{background:var(--bg-elev-2);border-color:var(--text-faint)}
.btn-outline.active{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;display:flex;align-items:center;gap:7px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.toast.ok{background:var(--accent-strong);color:var(--on-accent)}
.toast.err{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-border)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:490px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:88vh;overflow-y:auto}
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--text-faint);font-size:14px;gap:8px}
textarea{width:100%;border:1px solid var(--border);border-radius:11px;padding:10px 13px;font-size:14px;line-height:1.7;resize:vertical;background:var(--bg-elev-2);color:var(--text);outline:none;font-family:'Pretendard',sans-serif}
textarea:focus{border-color:var(--text-dim);box-shadow:0 0 0 3px var(--accent-soft);background:var(--bg-focus)}
input[type=date],input[type=password],input[type=text]{border:1px solid var(--border);border-radius:9px;padding:7px 12px;font-size:14px;color:var(--text);outline:none;background:var(--bg-elev-2);font-family:'Pretendard',sans-serif}
input:focus{border-color:var(--text-dim);box-shadow:0 0 0 3px var(--accent-soft);background:var(--bg-focus)}
.task-wrap{border-radius:10px;margin-bottom:2px;padding:7px 8px;transition:background .1s;border-bottom:1px solid var(--border-soft)}
.task-wrap:last-child{border-bottom:none}
.task-wrap:hover{background:var(--bg-elev-2)}
.day-col{flex:1 1 0;min-width:190px;background:var(--bg-elev);border-radius:16px;border:1px solid var(--border-soft);padding:14px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.day-col.today{border-color:var(--text-dim);box-shadow:0 2px 14px rgba(0,0,0,.35)}
.routine-card{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all .15s;box-shadow:var(--shadow)}
.routine-card.done{opacity:.5}
.routine-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.routine-check.done{background:var(--accent-strong);border-color:var(--accent-strong)}
.routine-group-label{font-size:12px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;margin:16px 4px 8px}
.routine-group-label:first-child{margin-top:2px}
/* 미니 캘린더 */
.mini-cal{margin-bottom:4px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-nav{width:22px;height:22px;border:none;background:transparent;cursor:pointer;color:var(--text-faint);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px}
.cal-nav:hover{background:var(--bg-elev-2);color:var(--text-dim)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{text-align:center;padding:5px 2px;font-size:12px;border-radius:5px;cursor:pointer;transition:all .1s;color:var(--text-dim);font-family:var(--font-mono)}
.cal-cell:hover{background:var(--bg-elev-2);color:var(--text)}
.cal-cell.today{background:var(--accent-strong);color:var(--on-accent);font-weight:700}
.cal-cell.has-task{position:relative}
.cal-cell.has-task::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--text)}
.cal-cell.today.has-task::after{background:var(--on-accent)}
.cal-day-label{text-align:center;font-size:10px;color:var(--text-faint);font-weight:600;padding:2px 0}
/* 태그 드롭다운 */
.tag-dropdown{position:absolute;top:100%;left:0;z-index:50;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:9px;min-width:190px;max-width:230px;display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag-option{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border-soft);background:var(--bg-elev-2);color:var(--text-dim);transition:all .1s}
.tag-dd-label{font-size:10px;font-weight:700;color:var(--text-faint);width:100%;text-transform:uppercase;letter-spacing:.4px}
.swatch{width:17px;height:17px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.swatch:hover{transform:scale(1.12)}
/* 홈 */
.home-grid{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
@media (max-width:760px){.home-grid{grid-template-columns:1fr}}
.home-today-task{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:14px}
.home-today-task:last-child{border-bottom:none}
.quick-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.quick-action{cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:0!important}
.quick-action-icon{width:34px;height:34px;border-radius:9px;background:var(--bg-elev-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
/* 일일 요약 (메신저용) */
.digest-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
@media (max-width:840px){.digest-layout{grid-template-columns:1fr}}
.digest-dates{background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:14px;padding:14px;max-height:calc(100vh - 130px);overflow-y:auto;box-shadow:var(--shadow)}
.digest-dates-title{font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.digest-month-group{margin-bottom:12px}
.digest-month-label{font-size:11px;color:var(--text-faint);font-weight:700;font-family:var(--font-mono);margin-bottom:4px;padding-left:4px}
.digest-date-item{display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--text-dim);cursor:pointer;font-family:var(--font-mono)}
.digest-date-item:hover{background:var(--bg-elev-2)}
.digest-date-item.active{background:var(--accent-strong);color:var(--on-accent);font-weight:700}
.digest-today-badge{font-size:10px;font-family:'Pretendard',sans-serif;background:var(--bg-elev-2);color:var(--text-dim);padding:1px 6px;border-radius:6px;font-weight:700}
.digest-date-item.active .digest-today-badge{background:rgba(0,0,0,.14);color:var(--on-accent)}
.digest-empty{font-size:12.5px;color:var(--text-faint);text-align:center;padding:16px 0}
.digest-header-card{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.digest-date-title{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.digest-date-sub{font-size:12px;color:var(--text-faint);margin-top:2px}
.digest-section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.digest-count{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--text-faint);background:var(--bg-elev-2);padding:1px 7px;border-radius:20px}
.digest-placeholder{font-size:13px;color:var(--text-faint);font-style:italic;padding:6px 0}
.digest-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.digest-list li{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--text);padding:7px 4px;border-radius:7px;line-height:1.5}
.digest-check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.digest-check:hover{border-color:var(--text)}
.digest-check.done{background:var(--accent-strong);border-color:var(--accent-strong)}
.digest-task-text{flex:1}
.digest-task-text.done{color:var(--text-faint);text-decoration:line-through}
.digest-tag{font-size:11px;font-weight:700;color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border-soft);padding:1px 7px;border-radius:5px;flex-shrink:0}
.digest-summary-card{border-color:var(--border)}
.digest-summary-text{font-size:14.5px;color:var(--text-dim);line-height:1.8}
.digest-auto-badge{font-size:10.5px;font-weight:600;color:var(--text-faint);background:none;padding:0;border-radius:0;text-transform:none;letter-spacing:0}
/* 주간 리포트 탭 */
.report-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.report-tab{padding:9px 15px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg-elev);color:var(--text-dim);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
.report-tab:hover{background:var(--bg-elev-2)}
.report-tab.active{font-weight:700;box-shadow:var(--shadow);background:var(--accent-strong);color:var(--on-accent);border-color:var(--accent-strong)}
.report-meta-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.report-summary-box{background:var(--bg-elev-2);border-left:3px solid var(--text);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.report-content{font-size:14px;line-height:1.9;color:var(--text-dim)}
.report-content h1,.report-content h2,.report-content h3{color:var(--text);margin:16px 0 8px;font-weight:700;letter-spacing:-.2px}
.report-content h1:first-child,.report-content h2:first-child,.report-content h3:first-child{margin-top:0}
.report-content h1{font-size:17px}
.report-content h2{font-size:15.5px}
.report-content h3{font-size:14.5px}
.report-content p{margin-bottom:10px}
.report-content ul,.report-content ol{margin:0 0 12px 20px}
.report-content li{margin-bottom:5px}
.report-content strong{color:var(--text);font-weight:700}
.report-content code{background:var(--bg-elev-2);padding:1px 5px;border-radius:4px;font-size:13px}
.report-content hr{border:none;border-top:1px solid var(--border-soft);margin:16px 0}
.report-content blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--text-faint);margin:10px 0}
.report-layout{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
@media (max-width:980px){.report-layout{grid-template-columns:1fr}}
.report-scroll{max-height:calc(100vh - 300px);min-height:300px;overflow-y:auto;padding-right:6px}
.report-scroll::-webkit-scrollbar{width:8px}
.report-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.report-scroll::-webkit-scrollbar-track{background:transparent}
.report-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:5}
.report-nav-pill{border:1px solid var(--border);background:var(--bg-elev);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:all .15s}
.report-nav-pill:hover{background:var(--bg-elev-2);border-color:var(--text-faint)}
.sticky-panel{position:sticky;top:8px}
.sticky-board{position:relative;min-height:560px;border:1.5px dashed var(--border);border-radius:16px;background:
  repeating-linear-gradient(0deg, transparent, transparent 27px, var(--border-soft) 27px, var(--border-soft) 28px),
  var(--bg-elev);overflow:hidden}
.sticky-note{position:absolute;width:190px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:box-shadow .15s}
.sticky-note:hover{box-shadow:0 8px 24px rgba(0,0,0,.5)}
.sticky-note-head{cursor:grab;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;border-top-left-radius:9px;border-top-right-radius:9px}
.sticky-note-head:active{cursor:grabbing}
.sticky-dot{width:11px;height:11px;border-radius:50%;cursor:pointer}
.sticky-note textarea{width:100%;border:none;background:transparent;resize:vertical;outline:none;padding:8px 9px;font-family:'Pretendard',sans-serif}
@media (max-width:980px){.report-layout{grid-template-columns:1fr}.sticky-panel{position:static}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef} = React
const SB_URL = 'https://zxfytktctzgkssxbqbyj.supabase.co'
const SB_KEY = 'sb_publishable_815pQE6fA0sXIBS3RcmDAA_6FptB6NS'
const DEFAULT_TAGS = ['물류','마케팅','광고','CS','리서치','시딩','브로드캐스팅','KPI','캠페인','가격정책','브랜드관리','기타']
const DAYS_KO = ['일','월','화','수','목','금','토']

/* ===== 태그 색상 시스템 ===== */
const TAG_PALETTE = [
  '#F2A65A', // 물류 - amber
  '#7FD9BF', // 마케팅 - mint
  '#7FB4E8', // 광고 - sky
  '#C7A8F2', // CS - violet
  '#F0A0C4', // 리서치 - pink
  '#E2685A', // 시딩 - coral
  '#B8D46A', // 브로드캐스팅 - lime
  '#F0C36B', // KPI - gold
  '#8FA8D9', // 캠페인 - slate blue
  '#D9957F', // 가격정책 - terracotta
  '#9ED9D0', // 브랜드관리 - aqua
  '#C9A0DC', // 기타 - lavender
  '#E89B9B','#8CC98C','#E0C46B','#A8B4E0','#D98CC9','#7FCBD9'
]
const DEFAULT_TAG_COLORS = {}
DEFAULT_TAGS.forEach((t,i)=>{ DEFAULT_TAG_COLORS[t]=TAG_PALETTE[i] })
function hexToRgba(hex,alpha){
  const h=(hex||'#7C7A73').replace('#','')
  const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16)
  return `rgba(${r},${g},${b},${alpha})`
}
function hashTag(tag){
  let hash=0
  for(let i=0;i<tag.length;i++) hash = tag.charCodeAt(i) + ((hash<<5)-hash)
  return Math.abs(hash)
}
function loadTagColors(){
  let saved={}
  try{ saved=JSON.parse(localStorage.getItem('d2c:tagColors')||'{}') }catch(e){}
  return {...DEFAULT_TAG_COLORS,...saved}
}
function persistTagColor(tag,color){
  let saved={}
  try{ saved=JSON.parse(localStorage.getItem('d2c:tagColors')||'{}') }catch(e){}
  saved[tag]=color
  localStorage.setItem('d2c:tagColors',JSON.stringify(saved))
}
function colorForTag(tag,tagColors){
  if(tagColors && tagColors[tag]) return tagColors[tag]
  return TAG_PALETTE[hashTag(tag||'')%TAG_PALETTE.length]
}

}
function weekStart(d=new Date()){

}
function weekDays(ws){

function summarizeDay(tasks){
  if(!tasks||!tasks.length) return ''
  const done=tasks.filter(t=>t.done)
  const pending=tasks.filter(t=>!t.done)
  const tagCounts={}
  done.forEach(t=>{ tagCounts[t.tag]=(tagCounts[t.tag]||0)+1 })
  const topTags=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0,3)
  const tagText=topTags.map(([tag,cnt])=>`${tag} ${cnt}건`).join(' · ')
  let s=`총 ${tasks.length}건 중 ${done.length}건 완료`
  if(tagText) s+=` (${tagText} 중심)`
  s+='.'
  if(pending.length){
    const names=pending.slice(0,2).map(t=>t.text).join(', ')
    s+=` 진행중 ${pending.length}건${names?` — ${names}${pending.length>2?' 외':''}`:''}.`
  }else if(done.length){
    s+=' 오늘 등록된 업무는 모두 마무리했습니다.'
  }
  return s
}

function splitReportSections(md){
  if(!md)return []
  const lines=md.split('\n')
  const sections=[]
  let current=null
  for(const line of lines){
    const h=line.match(/^(#{1,3})\s+(.*)/)
    if(h){
      if(current)sections.push(current)
      current={title:h[2].replace(/[*_`]/g,'').trim(),lines:[line]}
    }else{
      if(!current)current={title:'',lines:[]}
      current.lines.push(line)
    }
  }
  if(current)sections.push(current)
  return sections.filter(s=>s.lines.join('\n').trim().length>0)
}

function RoutineTab({onSync}){
  const [now,setNow]=useState(new Date())
  useEffect(()=>{
    const t=setInterval(()=>setNow(new Date()),30000)
    return()=>clearInterval(t)
  },[])
  const [template,setTemplate]=useState(loadRoutineTemplate)
  const [editing,setEditing]=useState(false)
  const dateStr=toDate(now)
  const weekday=now.getDay()
  const dailyItems=template.daily||[]
  const extraItems=extraItemsFor(template,weekday)
  const groupLabel=groupLabelFor(weekday)
  const tasks=[...dailyItems,...extraItems]
  const [checked,setChecked]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('d2c:routineCheck:'+dateStr)||'{}')}catch(e){return{}}
  })
  useEffect(()=>{
    try{setChecked(JSON.parse(localStorage.getItem('d2c:routineCheck:'+dateStr)||'{}'))}catch(e){setChecked({})}
  },[dateStr])
  function toggle(i){
    const updated={...checked,[i]:!checked[i]}
    setChecked(updated)
    localStorage.setItem('d2c:routineCheck:'+dateStr,JSON.stringify(updated))
    const item=tasks[i]
    if(item&&onSync)onSync(item.text,item.tag||'기타',updated[i])
  }
  function saveTemplate(next){
    setTemplate(next)
    localStorage.setItem('d2c:routineTemplate',JSON.stringify(next))
  }
  function updateGroupItem(group,idx,text){
    const next={...template,[group]:template[group].map((it,i)=>i===idx?{...it,text}:it)}
    saveTemplate(next)
  }
  function addGroupItem(group){
    const next={...template,[group]:[...(template[group]||[]),{text:'',tag:'기타'}]}
    saveTemplate(next)
  }
  function removeGroupItem(group,idx){
    const next={...template,[group]:template[group].filter((_,i)=>i!==idx)}
    saveTemplate(next)
  }
  const doneCount=tasks.filter((_,i)=>checked[i]).length
  const isWeekend=weekday===0||weekday===6
  const GROUP_LABELS={daily:'매일 (월~금 공통)',monToWed:'월·화·수 추가',thuFri:'목·금 추가'}
  function RoutineRow({idx,text}){
    return(
      <div className={`routine-card${checked[idx]?' done':''}`} onClick={()=>toggle(idx)} style={{cursor:'pointer'}}>
        <div className={`routine-check${checked[idx]?' done':''}`}>
          {checked[idx]&&<i className="ti ti-check" style={{fontSize:14,color:'var(--on-accent)'}}/>}
        </div>
        <span style={{flex:1,fontSize:15,fontWeight:600,color:'var(--text)',textDecoration:checked[idx]?'line-through':'none',letterSpacing:'-.1px'}}>{text}</span>
      </div>
    )
  }
  return(
    <div>
      <div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontSize:19,fontWeight:700,color:'var(--text)',letterSpacing:'-.3px',fontFamily:'var(--font-mono)'}}>{fmtDate(dateStr)}</div>
          <div style={{fontSize:12.5,color:'var(--text-faint)',marginTop:2}}>오늘의 루틴 업무 · 자동으로 매일 갱신됩니다</div>
        </div>
        <div style={{textAlign:'right'}}>
          {!isWeekend&&tasks.length>0&&(
            <div style={{fontSize:23,fontWeight:700,color:'var(--text)',fontFamily:'var(--font-mono)'}}>{doneCount}/{tasks.length}</div>
          )}
          <button className="btn-outline" style={{marginTop:6}} onClick={()=>setEditing(!editing)}>
            <i className="ti ti-settings" style={{fontSize:13}}/>{editing?'편집 종료':'항목 편집'}
          </button>
        </div>
      </div>
      {!editing?(
        isWeekend?(
          <div className="card" style={{textAlign:'center',padding:'36px 0',color:'var(--text-faint)',fontSize:14}}>
            주말은 등록된 루틴 업무가 없습니다 🙂
          </div>
        ):(
          <div>
            {dailyItems.length>0&&<div className="routine-group-label">매일 공통</div>}
            {dailyItems.map((t,i)=><RoutineRow key={i} idx={i} text={t.text}/>)}
            {extraItems.length>0&&<div className="routine-group-label">{groupLabel}</div>}
            {extraItems.map((t,j)=>{const idx=dailyItems.length+j;return <RoutineRow key={idx} idx={idx} text={t.text}/>})}
          </div>
        )
      ):(
        <div className="card">
          <div style={{fontSize:12.5,color:'var(--text-faint)',marginBottom:14,lineHeight:1.6}}>
            요일별로 반복되는 고정 업무 항목을 여기서 수정하세요. 저장은 자동으로 됩니다.
          </div>
          {Object.entries(GROUP_LABELS).map(([group,label])=>(
            <div key={group} style={{marginBottom:18}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--text-dim)',marginBottom:8}}>{label}</div>
              {(template[group]||[]).map((it,idx)=>(
                <div key={idx} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                  <input type="text" value={it.text} onChange={e=>updateGroupItem(group,idx,e.target.value)}
                    style={{flex:1,fontSize:13.5}}/>
                  <button onClick={()=>removeGroupItem(group,idx)}
                    style={{border:'none',background:'transparent',color:'var(--danger)',cursor:'pointer',padding:'2px 6px',fontSize:14}}>
                    <i className="ti ti-trash"/>
                  </button>
                </div>
              ))}
              <button className="btn-outline" onClick={()=>addGroupItem(group)}>
                <i className="ti ti-plus" style={{fontSize:12}}/>항목 추가
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  )
}
function StickyNote({note, onChange, onDelete}){
  function onDragStart(e){
    e.preventDefault()
    const startX=e.clientX,startY=e.clientY
    const origX=note.x,origY=note.y
    function onMove(ev){
      onChange({...note,x:Math.max(0,origX+(ev.clientX-startX)),y:Math.max(0,origY+(ev.clientY-startY))})
    }
    function onUp(){
      window.removeEventListener('mousemove',onMove)
      window.removeEventListener('mouseup',onUp)
    }
    window.addEventListener('mousemove',onMove)
    window.addEventListener('mouseup',onUp)
  }
  const c=STICKY_COLORS[note.color]||STICKY_COLORS.paper
  return(
    <div className="sticky-note" style={{left:note.x,top:note.y,background:c.bg,border:`1px solid ${c.border}`}}>
      <div className="sticky-note-head" onMouseDown={onDragStart} style={{background:c.border+'33'}}>
        <div style={{display:'flex',gap:4}}>
          {Object.entries(STICKY_COLORS).map(([k,cc])=>(
            <div key={k} className="sticky-dot" onClick={()=>onChange({...note,color:k})}
              style={{background:cc.border,border:note.color===k?'2px solid var(--text)':'2px solid transparent'}}/>
          ))}
        </div>
        <div style={{display:'flex',gap:3,alignItems:'center'}}>
          <button onClick={()=>onChange({...note,bold:!note.bold})} title="굵게"
            style={{border:'none',background:note.bold?'rgba(0,0,0,.15)':'transparent',cursor:'pointer',fontSize:11,fontWeight:800,padding:'1px 6px',borderRadius:4,color:'var(--text)'}}>
            B
          </button>
          <button onClick={onDelete} title="메모 삭제"
            style={{border:'none',background:'transparent',cursor:'pointer',color:'var(--danger)',fontSize:14,padding:'1px 3px',lineHeight:1}}>
            <i className="ti ti-x"/>
          </button>
        </div>
      </div>
      <textarea value={note.text} onChange={e=>onChange({...note,text:e.target.value})}
        placeholder="메모 입력..." rows={4}
        style={{fontSize:13.5,fontWeight:note.bold?700:400,color:'var(--text)'}}
      />
    </div>
  )
}

function DailyDigest({allRows, digestDate, setDigestDate, onSaveExtra, onToggleTask, notify, tagColors}){
  const recordedDates = allRows
    .filter(r=>r.date_key && !r.date_key.startsWith('__') && ((r.tasks&&r.tasks.length>0) || (r.notes&&r.notes.trim())))
    .map(r=>r.date_key)
    .sort((a,b)=>b.localeCompare(a))
  const row = allRows.find(r=>r.date_key===digestDate)
  const tasks = row?.tasks || []
  const done = tasks.filter(t=>t.done)
  const pending = tasks.filter(t=>!t.done)
  const daySummary = summarizeDay(tasks)
  const [extra,setExtra]=useState(()=>parseDayExtra(row?.notes||''))
  useEffect(()=>{ setExtra(parseDayExtra(row?.notes||'')) },[digestDate])
  const saveTimer=useRef(null)
  function updateExtra(next){
    setExtra(next)
    clearTimeout(saveTimer.current)
    saveTimer.current=setTimeout(()=>{ onSaveExtra(digestDate,next) },600)
  }
  const grouped={}
  recordedDates.forEach(d=>{
    const m=d.slice(0,7)
    if(!grouped[m]) grouped[m]=[]
    grouped[m].push(d)
  })
  async function copyToClipboard(){
    const lines=[]
    lines.push(`📅 ${fmtDateFull(digestDate)}`)
    if(daySummary){ lines.push(''); lines.push(`📋 ${daySummary}`) }
    lines.push('')
    lines.push('✅ 오늘 완료')
    lines.push(done.length? done.map(t=>`- ${t.text}`).join('\n') : '- 없음')
    lines.push('')
    lines.push('🔄 진행중')
    lines.push(pending.length? pending.map(t=>`- ${t.text}`).join('\n') : '- 없음')
    if(extra.issue&&extra.issue.trim()){ lines.push(''); lines.push('⚠️ 이슈·도움요청'); lines.push(extra.issue.trim()) }
    if(extra.priority&&extra.priority.trim()){ lines.push(''); lines.push('🎯 내일 최우선순위'); lines.push(extra.priority.trim()) }
    if(extra.memo&&extra.memo.trim()){ lines.push(''); lines.push('📝 개인 메모'); lines.push(extra.memo.trim()) }
    try{
      await navigator.clipboard.writeText(lines.join('\n'))
      notify('복사됐습니다. 메신저에 붙여넣으세요!')
    }catch(e){ notify('복사에 실패했습니다','err') }
  }
  return(
    <div className="digest-layout">
      <div className="digest-dates">
        <div className="digest-dates-title">🗂️ 기록된 날짜</div>
        {recordedDates.length===0&&<div className="digest-empty">기록이 없습니다</div>}
        {Object.entries(grouped).sort((a,b)=>b[0].localeCompare(a[0])).map(([month,dates])=>(
          <div key={month} className="digest-month-group">
            <div className="digest-month-label">{month.replace('-','.')}</div>
            {dates.map(d=>(
              <div key={d} className={`digest-date-item${d===digestDate?' active':''}`} onClick={()=>setDigestDate(d)}>
                <span>{fmtDate(d)}</span>
                {d===toDate()&&<span className="digest-today-badge">오늘</span>}
              </div>
            ))}
          </div>
        ))}
      </div>
      <div>
        <div className="card digest-header-card">
          <div>
            <div className="digest-date-title">{fmtDateFull(digestDate)}</div>
            <div className="digest-date-sub">D2C팀 · Shopee PH · 메신저 업무일지용 요약</div>
          </div>
          <button className="btn-primary" onClick={copyToClipboard}><i className="ti ti-copy" style={{fontSize:14}}/>복사하기</button>
        </div>
        {daySummary&&(
          <div className="card digest-summary-card">
            <div className="digest-section-title">📋 오늘 요약 <span className="digest-auto-badge">자동 생성 · 대략</span></div>
            <div className="digest-summary-text">{daySummary}</div>
          </div>
        )}
        <div className="card">
          <div className="digest-section-title">✅ 오늘 완료 <span className="digest-count">{done.length}</span></div>
          {done.length===0?<div className="digest-placeholder">완료한 업무가 없습니다</div>:
            <ul className="digest-list">{done.map((t,i)=>{
              const idx=tasks.findIndex(x=>x===t)
              const c=colorForTag(t.tag,tagColors)
              return(
                <li key={i}>
                  <div className="digest-check done" onClick={()=>onToggleTask(digestDate,idx)} title="완료 취소">
                    <i className="ti ti-check" style={{fontSize:12,color:'var(--on-accent)'}}/>
                  </div>
                  <span className="digest-tag" style={{color:c,background:hexToRgba(c,.16),borderColor:hexToRgba(c,.4)}}>{t.tag}</span>
                  <span className="digest-task-text done">{t.text}</span>
                </li>
              )
            })}</ul>}
        </div>
        <div className="card">
          <div className="digest-section-title">🔄 진행중 <span className="digest-count">{pending.length}</span></div>
          {pending.length===0?<div className="digest-placeholder">진행중인 업무가 없습니다</div>:
            <ul className="digest-list">{pending.map((t,i)=>{
              const idx=tasks.findIndex(x=>x===t)
              const c=colorForTag(t.tag,tagColors)
              return(
                <li key={i}>
                  <div className="digest-check" onClick={()=>onToggleTask(digestDate,idx)} title="완료로 표시">
                  </div>
                  <span className="digest-tag" style={{color:c,background:hexToRgba(c,.16),borderColor:hexToRgba(c,.4)}}>{t.tag}</span>
                  <span className="digest-task-text">{t.text}</span>
                </li>
              )
            })}</ul>}
        </div>
        <div className="card">
          <div className="digest-section-title">⚠️ 이슈 · 도움요청</div>
          <textarea rows={2} value={extra.issue} onChange={e=>updateExtra({...extra,issue:e.target.value})} placeholder="누가, 언제까지, 무엇을 확인해야 하는지"/>
        </div>
        <div className="card">
          <div className="digest-section-title">🎯 내일 최우선순위</div>
          <textarea rows={2} value={extra.priority} onChange={e=>updateExtra({...extra,priority:e.target.value})} placeholder="내일 반드시 처리할 1~3개"/>
        </div>
        <div className="card">
          <div className="digest-section-title">📝 개인 메모</div>
          <textarea rows={3} value={extra.memo} onChange={e=>updateExtra({...extra,memo:e.target.value})} placeholder="작성자 본인만 조회·수정 가능"/>
        </div>
      </div>
    </div>
  )
}

function App(){
  const [view,setView]=useState('dashboard')
  const [allRows,setAllRows]=useState([])
  const [curWeek,setCurWeek]=useState(weekStart())
  const [selDate,setSelDate]=useState(toDate())
  const [digestDate,setDigestDate]=useState(toDate())
  const [loading,setLoading]=useState(true)
  const [dragState,setDragState]=useState(null)
  const [dragOver,setDragOver]=useState(null)
  const [toast,setToast]=useState(null)
  const [showSettings,setShowSettings]=useState(false)
  const [notionWebhook,setNotionWebhook]=useState(()=>{try{return localStorage.getItem('d2c:notion')||''}catch(e){return ''}})
  const [notionInput,setNotionInput]=useState('')
  const [customTags,setCustomTags]=useState(()=>{try{return JSON.parse(localStorage.getItem('d2c:tags')||'[]')}catch(e){return[]}})
  const [tagColors,setTagColors]=useState(loadTagColors)
  const [reportsInitialType,setReportsInitialType]=useState(null)
  const contentRef=useRef()
  const allTags=[...DEFAULT_TAGS,...customTags]
  const refresh=useCallback(async()=>{
    setLoading(true)
    try{ setAllRows(await dbLoadAll()) }
    catch(e){ setAllRows([]) }
    finally{ setLoading(false) }
  },[])
  useEffect(()=>{ refresh() },[refresh])
  function notify(msg,type='ok'){setToast({msg,type});setTimeout(()=>setToast(null),3000)}
  function addCustomTag(tag){
    const updated=[...customTags,tag]
    setCustomTags(updated)
    localStorage.setItem('d2c:tags',JSON.stringify(updated))
  }
  function changeTagColor(tag,color){
    persistTagColor(tag,color)
    setTagColors(prev=>({...prev,[tag]:color}))
  }
  const getRow=(dk)=>allRows.find(r=>r.date_key===dk)
  const rows=allRows.filter(r=>r.week_key===curWeek)
  async function saveRow(dateKey,tasks,notes){
    const wk=weekStart(new Date(dateKey+'T00:00:00'))
    const existing=getRow(dateKey)
    const payload={week_key:wk,date_key:dateKey,tasks,notes:notes||'',updated_at:new Date().toISOString()}
    setAllRows(prev=>existing?prev.map(r=>r.date_key===dateKey?{...r,...payload}:r):[...prev,payload])
    const ok=await dbSave(payload)
    if(!ok)notify('저장 실패','err')
    return ok
  }
  async function toggleTask(dateKey,idx){
    const row=getRow(dateKey);if(!row||idx<0)return
    const tasks=row.tasks.map((t,i)=>i===idx?{...t,done:!t.done}:t)
    await saveRow(dateKey,tasks,row.notes||'')
  }
  async function updateTask(dateKey,idx,updated){
    const row=getRow(dateKey);if(!row)return
    const tasks=row.tasks.map((t,i)=>i===idx?{...t,...updated}:t)
    await saveRow(dateKey,tasks,row.notes||'')
  }
  async function deleteTask(dateKey,idx){
    const row=getRow(dateKey);if(!row)return
    const tasks=row.tasks.filter((_,i)=>i!==idx)
    await saveRow(dateKey,tasks,row.notes||'')
    notify('삭제됐습니다.')
  }
  async function addTasks(dateKey,newTasks){
    if(!newTasks||!newTasks.length)return
    const row=getRow(dateKey)
    const tasks=row?[...row.tasks,...newTasks]:newTasks
    await saveRow(dateKey,tasks,row?.notes||'')
    sendToNotion(dateKey,tasks)
    notify(`${newTasks.length}건 추가됐습니다!`)
  }
  async function deleteDay(dateKey){
    const row=getRow(dateKey)
    await dbRemove(row?row.week_key:curWeek,dateKey)
    setAllRows(prev=>prev.filter(r=>r.date_key!==dateKey))
    notify('삭제됐습니다.')
  }
  async function saveExtra(dateKey,extra){
    const row=getRow(dateKey)
    await saveRow(dateKey,row?row.tasks:[],stringifyDayExtra(extra))
  }
  async function syncRoutineTask(text,tag,checked){
    const today=toDate()
    const row=getRow(today)
    let tasks=row?[...row.tasks]:[]
    if(checked){
      if(!tasks.some(t=>t.fromRoutine&&t.text===text))tasks.push({text,tag,done:false,fromRoutine:true})
    }else{
      tasks=tasks.filter(t=>!(t.fromRoutine&&t.text===text))
    }
    await saveRow(today,tasks,row?.notes||'')
    notify(checked?'업무일지에 추가했어요!':'업무일지에서 제거했어요.')
  }
  async function sendToNotion(dateKey,tasks){
    if(!notionWebhook)return
    try{
      await fetch(notionWebhook,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          date:dateKey,week:fmtWeek(curWeek),
          tasks:tasks.map(t=>({text:t.text,tag:t.tag,done:t.done,memo:t.memo||''})),
          timestamp:new Date().toLocaleString('ko-KR'),source:'D2C 업무일지'
        })
      })
    }catch(e){console.log('Notion webhook error',e)}
  }
  function pendingRoutineCount(){
    const template=loadRoutineTemplate()
    const wd=new Date().getDay()
    const tasks=todaysRoutineTasks(template,wd)
    if(!tasks.length)return 0
    let checked={}
    try{checked=JSON.parse(localStorage.getItem('d2c:routineCheck:'+toDate())||'{}')}catch(e){}
    return tasks.filter((_,i)=>!checked[i]).length
  }
  const days=weekDays(curWeek),today=toDate()
  const thisActualWeek=weekStart()
  const homeWeekRows=allRows.filter(r=>r.week_key===thisActualWeek)
  const homeWeekTasks=homeWeekRows.flatMap(r=>r.tasks||[])

  const homeWeekPct=homeWeekTasks.length?Math.round(homeWeekDone/homeWeekTasks.length*100):0
  const todayRow=getRow(today)
  const todayTasks=todayRow?.tasks||[]

    {id:'digest',icon:'ti-clipboard-text',lbl:'일일요약',emoji:'💬',c:'var(--nav-digest)'},
    {id:'reports',icon:'ti-report-analytics',lbl:'리포트',emoji:'📊',c:'var(--nav-reports)'},
    {id:'shopdora',icon:'ti-building-store',lbl:'샵도라',emoji:'🛍️',c:'var(--nav-shopdora)'},
  ]

  return(

          <button key={n.id} className={`sb-btn${view===n.id?' active':''}`} onClick={()=>setView(n.id)} title={n.lbl}>
            <span className="sb-tile" style={{background:view===n.id?n.c:'var(--bg-elev-2)',color:view===n.id?'var(--on-accent)':n.c}}>
              <i className={`ti ${n.icon}`}/>
              {n.id==='routine'&&pendingRoutineCount()>0&&<span className="sb-dot"/>}
            </span>
            <span className="sb-label">{n.lbl}</span>
          </button>
        ))}
        <div style={{flex:1}}/>
        <button className="sb-btn" onClick={()=>setShowSettings(true)}>
          <span className="sb-tile" style={{background:'var(--bg-elev-2)',color:'var(--text-dim)'}}>
            <i className="ti ti-settings"/>
          </span>
          <span className="sb-label">설정</span>
        </button>
      </div>
      <div className="main-wrap">
        <div className="topbar">
          <div>
            <div className="topbar-title">{NAV.find(n=>n.id===view)?.emoji} {NAV.find(n=>n.id===view)?.lbl}</div>
            <div className="topbar-sub">D2C팀 · {view==='routine'?fmtDate(toDate()):view==='digest'?'메신저용 요약':fmtWeek(curWeek)}</div>

        <div className="body-wrap">

              {loading&&<div className="loading"><i className="ti ti-loader"/>불러오는 중...</div>}
              {!loading&&view==='routine'&&(
                <RoutineTab onSync={syncRoutineTask}/>
              )}
              {!loading&&view==='dashboard'&&(
                <div>
                  <div className="stat-grid">
                    {[
                      {lbl:'✅ 이번 주 완료',val:homeWeekDone},
                      {lbl:'📋 이번 주 전체',val:homeWeekTasks.length},
                      {lbl:'📈 이번 주 진행률',val:`${homeWeekPct}%`},
                    ].map((s,i)=>(
                      <div key={i} className="stat-card">
                        <div style={{fontSize:12,color:'var(--text-dim)',marginBottom:4,fontWeight:500}}>{s.lbl}</div>

                  </div>

                        ):(
                          todayTasks.map((t,i)=>({t,i})).sort((a,b)=>(a.t.done===b.t.done?0:(a.t.done?1:-1))).map(({t,i})=>(
                            <div key={i} className="home-today-task" onClick={()=>toggleTask(today,i)}>
                              <div className={`routine-check${t.done?' done':''}`} style={{width:18,height:18,borderRadius:6}}>

                  <ManualInput allTags={allTags} onAddTag={addCustomTag} tagColors={tagColors} onChangeColor={changeTagColor} onSave={(tasksArr)=>addTasks(selDate,tasksArr)}/>
                </div>
              )}
              {!loading&&view==='weekly'&&(
                <div>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
                    <button className="btn-outline" style={{width:32,height:32,padding:0,justifyContent:'center'}}
                      onClick={()=>{const d=new Date(curWeek+'T00:00:00');d.setDate(d.getDate()-7);setCurWeek(weekStart(d))}}>
                      <i className="ti ti-chevron-left" style={{fontSize:14}}/>
                    </button>
                    <span style={{flex:1,textAlign:'center',fontSize:15,fontWeight:700,color:'var(--text)'}}>{fmtWeek(curWeek)}</span>
                    <button className="btn-outline" style={{width:32,height:32,padding:0,justifyContent:'center'}}
                      onClick={()=>{const d=new Date(curWeek+'T00:00:00');d.setDate(d.getDate()+7);setCurWeek(weekStart(d))}}>
                      <i className="ti ti-chevron-right" style={{fontSize:14}}/>
                    </button>
                  </div>
                  <div style={{display:'flex',gap:12,overflowX:'auto',paddingBottom:10,alignItems:'flex-start'}}>
                    {days.map(d=>{
                      const row=getRow(d),isT=d===today
                      const done=(row?.tasks||[]).filter(t=>t.done).length,total=(row?.tasks||[]).length
                      const dayExtra=parseDayExtra(row?.notes||'')
                      const handleDrop=async()=>{
                        if(!dragState||!dragOver){setDragState(null);setDragOver(null);return}
                        if(dragState.dateKey===dragOver.dateKey){
                          const r=getRow(dragState.dateKey)
                          if(r){
                            const tasks=[...r.tasks]
                            const [moved]=tasks.splice(dragState.idx,1)
                            tasks.splice(Math.min(dragOver.idx,tasks.length),0,moved)
                            await saveRow(dragState.dateKey,tasks,r.notes||'')
                          }
                        }else{
                          const srcRow=getRow(dragState.dateKey)
                          if(srcRow){
                            const srcTasks=[...srcRow.tasks]
                            const [moved]=srcTasks.splice(dragState.idx,1)
                            await saveRow(dragState.dateKey,srcTasks,srcRow.notes||'')
                            const destRow=getRow(dragOver.dateKey)
                            const destTasks=destRow?[...destRow.tasks]:[]
                            destTasks.splice(Math.min(dragOver.idx,destTasks.length),0,moved)
                            await saveRow(dragOver.dateKey,destTasks,destRow?.notes||'')
                            notify('다른 날짜로 이동했습니다!')
                          }
                        }
                        setDragState(null);setDragOver(null)
                      }
                      return(
                        <div key={d} className={`day-col${isT?' today':''}`}
                          onDragOver={e=>{e.preventDefault();if(dragState)setDragOver({dateKey:d,idx:(row?.tasks?.length||0)})}}
                          onDrop={handleDrop}>
                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--border-soft)'}}>
                            <div>
                              <div style={{fontSize:isT?15:14,fontWeight:700,color:'var(--text)',fontFamily:'var(--font-mono)'}}>{fmtDate(d)}</div>
                              {isT&&<span style={{fontSize:10.5,padding:'2px 7px',borderRadius:8,background:'var(--accent-strong)',color:'var(--on-accent)',fontWeight:700,letterSpacing:'.3px'}}>TODAY</span>}
                            </div>
                            <div style={{display:'flex',alignItems:'center',gap:4}}>
                              {total>0&&<span style={{fontSize:12,color:'var(--text-faint)',fontWeight:700,fontFamily:'var(--font-mono)'}}>{done}/{total}</span>}
                              <button onClick={()=>{setSelDate(d);setView('input')}} title={row?'업무 추가':'업무 입력'}
                                style={{width:22,height:22,border:'none',background:'var(--bg-elev-2)',cursor:'pointer',color:'var(--text)',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center'}}>
                                <i className="ti ti-plus" style={{fontSize:13}}/>
                              </button>
                              {row&&(
                                <button onClick={()=>deleteDay(d)} title="이 날짜 전체 삭제" style={{width:22,height:22,border:'none',background:'transparent',cursor:'pointer',color:'var(--text-faint)',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center'}}>
                                  <i className="ti ti-trash" style={{fontSize:12}}/>
                                </button>
                              )}
                            </div>
                          </div>
                          <div style={{flex:1,display:'flex',flexDirection:'column',gap:2}}>
                            {(row?.tasks||[]).map((t,i)=>({t,i})).sort((a,b)=>(a.t.done===b.t.done?0:(a.t.done?1:-1))).map(({t,i})=>(
                              <TaskItem key={i} task={t} allTags={allTags} tagColors={tagColors} onChangeColor={changeTagColor}
                                isDragging={dragState?.dateKey===d&&dragState?.idx===i}
                                onToggle={()=>toggleTask(d,i)}
                                onUpdate={(updated)=>updateTask(d,i,updated)}
                                onDelete={()=>deleteTask(d,i)}
                                onDragStart={()=>setDragState({dateKey:d,idx:i})}
                                onDragOver={()=>setDragOver({dateKey:d,idx:i})}
                                onDrop={handleDrop}
                              />
                            ))}
                            {dayExtra.memo&&(
                              <div style={{margin:'6px 2px 2px',padding:'8px 10px',background:'var(--bg-elev-2)',borderRadius:8,fontSize:12.5,color:'var(--text-dim)',lineHeight:1.6,borderLeft:'3px solid var(--border)',whiteSpace:'pre-wrap'}}>
                                {dayExtra.memo}
                              </div>
                            )}
                            {!row&&(
                              <div style={{textAlign:'center',padding:'20px 4px',fontSize:13,color:'var(--text-faint)',fontStyle:'italic'}}>
                                {isT?'오늘 업무를 입력해주세요 ✍️':'업무 기록 없음'}
                              </div>
                            )}
                          </div>
                        </div>
                      )
                    })}
                  </div>
                </div>
              )}
              {!loading&&view==='digest'&&(
                <DailyDigest allRows={allRows} digestDate={digestDate} setDigestDate={setDigestDate}
                  onSaveExtra={saveExtra} onToggleTask={toggleTask} notify={notify} tagColors={tagColors}/>
              )}
              {!loading&&view==='reports'&&(
                <WeeklyReports initialType={reportsInitialType}/>
              )}
              {!loading&&view==='shopdora'&&(
                <ShopdoraTab onGoToReport={()=>{setReportsInitialType('shopdora_analysis');setView('reports')}}/>
              )}
            </div>
          </div>
        </div>
      </div>
      {showSettings&&(
        <div className="modal-bg" onClick={()=>setShowSettings(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:16,fontWeight:700,color:'var(--text)',marginBottom:6}}>
              🔌 연동 설정
            </div>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text)',marginBottom:4}}>📋 노션 연동 (선택)</div>
            <div style={{fontSize:12.5,color:'var(--text-dim)',lineHeight:1.7,marginBottom:10}}>
              Make.com Webhook URL 입력
            </div>
            <input type="text" value={notionInput||notionWebhook} onChange={e=>setNotionInput(e.target.value)}
              placeholder="https://hook.us2.make.com/..." style={{width:'100%',marginBottom:8,fontSize:13}}/>
            {notionWebhook&&<div style={{fontSize:12,color:'var(--text)',marginBottom:12}}>✅ 노션 연동 설정됨</div>}
            <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14}}>
              <button className="btn-outline" onClick={()=>setShowSettings(false)}>취소</button>
              <button className="btn-primary" onClick={()=>{
                if(notionInput.trim()){localStorage.setItem('d2c:notion',notionInput);setNotionWebhook(notionInput)}
                setShowSettings(false);notify('저장됐습니다.')
              }}>저장</button>
            </div>
            <div style={{fontSize:14,fontWeight:700,color:'var(--text)',marginBottom:4,marginTop:20,paddingTop:16,borderTop:'1px solid var(--border-soft)'}}>🎨 태그 색상 관리</div>
            <div style={{fontSize:12.5,color:'var(--text-dim)',lineHeight:1.7,marginBottom:10}}>
              태그마다 원하는 색을 눌러서 지정하세요. (태그를 클릭해도 바로 바꿀 수 있어요)
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:9,maxHeight:230,overflowY:'auto',paddingRight:4}}>
              {allTags.map(tag=>{
                const c=colorForTag(tag,tagColors)
                return(
                  <div key={tag} style={{display:'flex',alignItems:'center',gap:9}}>
                    <span style={{fontSize:12,fontWeight:700,minWidth:76,color:c,background:hexToRgba(c,.14),border:`1px solid ${hexToRgba(c,.4)}`,borderRadius:6,padding:'2px 7px',textAlign:'center'}}>{tag}</span>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',flex:1}}>
                      {TAG_PALETTE.map((p,i)=>(
                        <div key={i} className="swatch" onClick={()=>changeTagColor(tag,p)}
                          style={{background:p,borderColor:c===p?'var(--text)':'transparent'}}/>
                      ))}
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        </div>
      )}
      {toast&&(
        <div className={`toast ${toast.type}`}>
          <i className={`ti ${toast.type==='ok'?'ti-circle-check':'ti-alert-circle'}`}/>{toast.msg}
        </div>
      )}
    </div>
  )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
